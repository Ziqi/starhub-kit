name: StarHub EGM 3.0 CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions: {}

jobs:
  egm-verify:
    name: Declarative Compiler, Fuzz Test & 7-Dim EGM Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: FSFE REUSE 3.2 SPDX License & Copyright Audit
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Verify compiler parity (zero drift vs STARHUB_GROUND_TRUTH.json)
        run: ./bin/starhub render --check

      - name: Render full deployment bundle, modular dry-run, reproducible archive, SBOM & check shell syntax
        run: |
          ./bin/starhub render --profile minimal --only mihomo --dry-run > /dev/null
          ./bin/starhub render --out-dir ./dist
          ./bin/starhub archive --verify
          python3 ./scripts/generate-sbom.py --version ci-check --output ./dist/starhub-kit.spdx.json
          bash -n ./bin/starhub ./scripts/*.sh ./dist/*.sh

      - name: Enforce >=80% statement coverage gate (OpenSSF Silver)
        run: python3 ./tests/test_coverage_gate.py --min-coverage 80

      - name: Run 2,000-iteration compiler & security invariant fuzz suite
        run: python3 ./tests/fuzz_starhub_ctl.py --iterations 2000

      - name: Run StarHub EGM 3.0 static harness
        run: ./bin/starhub doctor --local-docs-only

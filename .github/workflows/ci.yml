# SPDX-License-Identifier: MIT
name: StarHub EGM 3.0 CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions: {}

jobs:
  egm-verify:
    name: Declarative Compiler & 7-Dim EGM Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Verify compiler parity (zero drift vs STARHUB_GROUND_TRUTH.json)
        run: ./bin/starhub render --check

      - name: Render full deployment bundle to dist/ and check shell syntax
        run: |
          ./bin/starhub render --out-dir ./dist
          bash -n ./bin/starhub ./scripts/*.sh ./dist/*.sh

      - name: Run StarHub EGM 3.0 static harness
        run: ./bin/starhub doctor --local-docs-only

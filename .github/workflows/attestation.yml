name: SLSA Build Level 3 & SBOM Attestation

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

jobs:
  attest:
    name: Build Deterministic Bundle, SPDX SBOM & Sigstore SLSA L3 Attestation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Build deterministic release archive & SPDX-2.3 SBOM
        run: |
          mkdir -p ./artifacts
          ./bin/starhub archive --prefix starhub-kit --output ./artifacts/starhub-kit-bundle.tar.gz --verify
          python3 ./scripts/generate-sbom.py --version "${GITHUB_REF_NAME:-main}" --output ./artifacts/starhub-kit.spdx.json
          sha256sum ./artifacts/starhub-kit-bundle.tar.gz ./artifacts/starhub-kit.spdx.json

      - name: Generate Sigstore / GitHub OIDC SLSA Build Level 3 Attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ./artifacts/starhub-kit-bundle.tar.gz
            ./artifacts/starhub-kit.spdx.json

      - name: Generate Sigstore / GitHub OIDC SPDX-2.3 SBOM Attestation
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: ./artifacts/starhub-kit-bundle.tar.gz
          sbom-path: ./artifacts/starhub-kit.spdx.json

      - name: Upload attested bundle & SPDX-2.3 SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: starhub-kit-slsa3-attested-bundle
          path: |
            ./artifacts/starhub-kit-bundle.tar.gz
            ./artifacts/starhub-kit.spdx.json
          retention-days: 30

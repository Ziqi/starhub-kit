      affiliation: Independent Maintainer
      social: https://github.com/Ziqi
      primary: true
  repositories:
    - name: starhub-kit
      url: https://github.com/Ziqi/starhub-kit
      comment: Declarative Multi-Site Zero-Collision Mesh, Anti-Stall Gateway & AI-Governed Infrastructure Toolkit (OpenSSF Best Practices Silver #16658)

repository:
  url: https://github.com/Ziqi/starhub-kit
  status: active
  accepts-change-request: true
  accepts-automated-change-request: true
  core-team:
    - name: Ziqi Xiao
      affiliation: Independent Maintainer
      social: https://github.com/Ziqi
      primary: true
  license:
    url: https://github.com/Ziqi/starhub-kit/blob/main/LICENSE
    expression: MIT
  security:
    assessments:
      self:
        evidence: https://www.bestpractices.dev/projects/16658
        date: '2026-11-13'
        comment: OpenSSF Best Practices Silver certification (Project #16658, 200% tiered score: 67/67 Passing + 55/55 Silver) and architecture threat-model assurance review in SECURITY.md.
    tools:
      - name: CodeQL
        type: SAST
        integration:
          ad-hoc: false
          ci: true
          before-release: true
        results:
          ad-hoc: false
          ci: true
          before-release: true
        comment: GitHub CodeQL v4 Python static analysis on all pushes and pull requests.
      - name: StarHub Fuzz & Invariant Suite
        type: Fuzzer
        integration:
          ad-hoc: true
          ci: true
          before-release: true
        results:
          ad-hoc: true
          ci: true
          before-release: true
        comment: Google Atheris + 2,000-iteration stdlib compiler & Zero-PII invariant fuzzer (tests/fuzz_starhub_ctl.py).
      - name: OpenSSF Scorecard
        type: SCA
        integration:
          ad-hoc: true
          ci: true
          before-release: true
        results:
          ad-hoc: true
          ci: true
          before-release: true
        comment: Continuous supply-chain security audit (scorecard.dev).
  documentation:
    contributing-guide: https://github.com/Ziqi/starhub-kit/blob/main/CONTRIBUTING.md
    governance: https://github.com/Ziqi/starhub-kit/blob/main/GOVERNANCE.md
    security-policy: https://github.com/Ziqi/starhub-kit/blob/main/SECURITY.md
    code-of-conduct: https://github.com/Ziqi/starhub-kit/blob/main/CODE_OF_CONDUCT.md
  release:
    automated-pipeline: true
    attestations:
      - name: GitHub Artifact Attestations (Sigstore / SLSA Build Level 3)
        predicate-uri: https://slsa.dev/provenance/v1
        location: https://github.com/Ziqi/starhub-kit/attestations
        comment: Cryptographic X.509 OIDC build provenance & SPDX-2.3 SBOM attestations via actions/attest-build-provenance & actions/attest-sbom.
    sbom:
      - sbom-file: https://github.com/Ziqi/starhub-kit/releases/latest
        format: SPDX
        comment: Automated ISO/IEC 5962 SPDX-2.3 JSON SBOM generated by scripts/generate-sbom.py.

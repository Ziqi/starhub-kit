<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="920" height="440" role="img" aria-label="StarHub Kit v1.2.0 15-second zero-root terminal demo">
  <!-- SPDX-FileCopyrightText: 2026 StarHub Contributors -->
  <!-- SPDX-License-Identifier: MIT -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; font-size: 13.2px; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12.5px; fill: #8b949e; font-weight: 600; }
      .prompt { fill: #58a6ff; font-weight: 700; }
      .cmd { fill: #f0f6fc; }
      .comment { fill: #8b949e; }
      .pass { fill: #3fb950; font-weight: 700; }
      .key { fill: #79c0ff; }
      .val { fill: #a5d6ff; }
      .warn { fill: #d29922; font-weight: 600; }

      .s1 { opacity: 0; animation: show1 15s infinite; }
      .s2 { opacity: 0; animation: show2 15s infinite; }
      .s3 { opacity: 0; animation: show3 15s infinite; }
      .s4 { opacity: 0; animation: show4 15s infinite; }
      .s5 { opacity: 0; animation: show5 15s infinite; }
      .s6 { opacity: 0; animation: show6 15s infinite; }

      @keyframes show1 { 0%, 2% { opacity: 0; } 5%, 94% { opacity: 1; } 98%, 100% { opacity: 0; } }
      @keyframes show2 { 0%, 12% { opacity: 0; } 16%, 94% { opacity: 1; } 98%, 100% { opacity: 0; } }
      @keyframes show3 { 0%, 34% { opacity: 0; } 38%, 94% { opacity: 1; } 98%, 100% { opacity: 0; } }
      @keyframes show4 { 0%, 46% { opacity: 0; } 50%, 94% { opacity: 1; } 98%, 100% { opacity: 0; } }
      @keyframes show5 { 0%, 66% { opacity: 0; } 70%, 94% { opacity: 1; } 98%, 100% { opacity: 0; } }
      @keyframes show6 { 0%, 76% { opacity: 0; } 80%, 94% { opacity: 1; } 98%, 100% { opacity: 0; } }
    </style>
  </defs>

  <rect x="0" y="0" width="920" height="440" rx="10" fill="url(#bgGrad)" stroke="#30363d" stroke-width="1.5"/>
  <rect x="0" y="0" width="920" height="36" rx="10" fill="#161b22"/>
  <line x1="0" y1="36" x2="920" y2="36" stroke="#30363d" stroke-width="1"/>
  <circle cx="20" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="18" r="6" fill="#27c93f"/>
  <text x="460" y="22" text-anchor="middle" class="title">starhub-kit v1.2.0 — Zero-Root Declarative Compiler &amp; 8-Dim Verification Demo</text>

  <!-- Step 1: Modular Mihomo Dry-Run -->
  <g class="s1">
    <text x="24" y="68" class="mono"><tspan class="prompt">$</tspan> <tspan class="cmd">./bin/starhub render --profile minimal --only mihomo --dry-run</tspan></text>
  </g>
  <g class="s2">
    <text x="24" y="92" class="mono comment"># === [DRY-RUN PREVIEW] mihomo-gateway.yaml (profile=minimal, only=mihomo, 0 files written) ===</text>
    <text x="24" y="114" class="mono"><tspan class="key">dns.nameserver-policy:</tspan> <tspan class="val">"+.ts.net" -&gt; 100.100.100.100#tailscale0</tspan> <tspan class="comment">(zero fallback: racing)</tspan></text>
    <text x="24" y="136" class="mono"><tspan class="key">rules[top]:</tspan> <tspan class="val">IP-CIDR,100.64.0.0/10,DIRECT,no-resolve</tspan> <tspan class="comment">|</tspan> <tspan class="warn">AND,((NETWORK,UDP),(DST-PORT,443),(DOMAIN-SUFFIX,gmail.com)),REJECT</tspan></text>
  </g>

  <!-- Step 2: Cloud AI Sandbox Dual-Stack Firewall Dry-Run -->
  <g class="s3">
    <text x="24" y="174" class="mono"><tspan class="prompt">$</tspan> <tspan class="cmd">./bin/starhub render --only ai-sandbox --dry-run</tspan></text>
  </g>
  <g class="s4">
    <text x="24" y="198" class="mono comment"># === [DRY-RUN PREVIEW] starhub-dash-fw.sh &amp; agent-tailscale-bootstrap.sh ===</text>
    <text x="24" y="220" class="mono"><tspan class="warn">iptables  -I STARHUB-BOT-NOSSH  1 -s 100.64.0.91 -p tcp --dport 22 -j DROP</tspan>   <tspan class="comment"># Hard-block SSH</tspan></text>
    <text x="24" y="242" class="mono"><tspan class="warn">ip6tables -I STARHUB-BOT-NOSSH6 1 -s 2001:db8::91 -p tcp --dport 22 -j DROP</tspan>  <tspan class="comment"># Dual-stack parity</tspan></text>
    <text x="24" y="264" class="mono"><tspan class="pass">iptables  -A STARHUB-DASH-ACL     -s 100.64.0.91 -p tcp --dport 3001 -j RETURN</tspan> <tspan class="comment"># Scoped Web API only</tspan></text>
  </g>

  <!-- Step 3: Zero-Drift, Fuzz & Bit-for-Bit Reproducible Build Verification -->
  <g class="s5">
    <text x="24" y="302" class="mono"><tspan class="prompt">$</tspan> <tspan class="cmd">./bin/starhub render --check &amp;&amp; ./bin/starhub archive --verify &amp;&amp; python3 tests/fuzz_starhub_ctl.py</tspan></text>
  </g>
  <g class="s6">
    <text x="24" y="328" class="mono"><tspan class="pass">[PASS] [COMPILER-PARITY]</tspan> <tspan class="cmd">8/8 compiled artifacts match STARHUB_GROUND_TRUTH.json (0 drift).</tspan></text>
    <text x="24" y="352" class="mono"><tspan class="pass">[PASS] [REPRODUCIBLE-BUILD]</tspan> <tspan class="cmd">Bit-for-bit deterministic archive verified (mtime=0, uid/gid=0, SPDX-2.3).</tspan></text>
    <text x="24" y="376" class="mono"><tspan class="pass">[PASS] [FUZZ-HARNESS]</tspan> <tspan class="cmd">Completed 2000 fuzz iterations + 6 edge cases (0 crashes, all invariants held).</tspan></text>
    <text x="24" y="408" class="mono comment"># OpenSSF Best Practices Silver (#16658)  |  Scorecard 8.1/10  |  SLSA Build Level 3  |  Zero Third-Party Deps</text>
  </g>
</svg>
